<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226 160" role="img" aria-labelledby="title desc">
<title id="title">Récepteur infrarouge — schéma fonctionnel</title>
<desc id="desc">Une photodiode en mode photovoltaïque alimente l'entrée inverseuse d'un amplificateur transimpédance avec résistance de contre-réaction. Le signal traverse ensuite les blocs de démodulation FM par PLL, filtrage passe-bas et amplification audio jusqu'au haut-parleur.</desc>
